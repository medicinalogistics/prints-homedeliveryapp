<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosage Label - 4x6cm Portrait</title>
    <style>
        /* Base Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: Arial, Helvetica, sans-serif; 
            background-color: #f4f5f7; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #000;
        }
        
        /* UI for Browser Preview */
        .no-print-bar { width: 100%; padding: 10px; background: #eee; text-align: center; margin-bottom: 15px; }
        .btn-print { padding: 8px 16px; background: #0078d4; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        #labels-wrapper { display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }

        /* 40x60mm Label Container */
        .label-card {
            width: 40mm;
            height: 60mm;
            background-color: #fff;
            border: 1px dashed #999; /* Dashed line for preview only */
            padding: 1.5mm 2mm;
            overflow: hidden;
            font-size: 7.5px; /* Extremely small text for 40mm width */
            line-height: 1.25;
        }

        /* Compact Layout Structure */
        .header { text-align: center; font-weight: bold; font-size: 8.5px; border-bottom: 1px solid #000; padding-bottom: 2px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; }
        .row { display: flex; margin-bottom: 1px; }
        .lbl { font-weight: bold; margin-right: 2px; flex-shrink: 0; }
        .val { flex-grow: 1; word-wrap: break-word; }
        
        .drug-row { font-weight: bold; font-size: 8px; border-bottom: 1px dashed #000; padding-bottom: 2px; margin-bottom: 2px; margin-top: 1px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; border-bottom: 1px solid #000; padding-bottom: 2px; margin-bottom: 2px; }
        .grid .row { margin-bottom: 0; }
        
        .inst-eng { font-weight: bold; font-size: 8px; }
        .inst-ar { direction: rtl; text-align: right; font-weight: bold; font-size: 9px; margin-top: 1px; }

        /* Strict Print Override */
        @media print {
            @page {
                size: 40mm 60mm; /* Forces the printer to recognize the exact physical roll size */
                margin: 0;
            }
            body { background-color: #fff; padding: 0; margin: 0; display: block; }
            .no-print-bar { display: none !important; }
            #labels-wrapper { gap: 0; padding: 0; display: block; }
            .label-card {
                border: none; /* Remove preview dashed border */
                margin: 0;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                page-break-after: always;
            }
            .label-card:last-child { page-break-after: avoid; }
        }
    </style>
</head>
<body>

    <div class="no-print-bar">
        <button class="btn-print" onclick="window.print()">Print Labels (6x4 Portrait)</button>
    </div>

    <div id="labels-wrapper"></div>

    <script>
        (async function renderLabels() {
            const params = new URLSearchParams(window.location.search);
            const rawData = params.get('data');
            const autoPrint = params.get('print') === '1';
            const wrapper = document.getElementById('labels-wrapper');

            if (!rawData) return wrapper.innerHTML = '<p>No label data received.</p>';

            try {
                const items = JSON.parse(rawData);
                let htmlContent = '';

                for (const item of items) {
                    let arabicInst = '';
                    
                    // Fetch Arabic Translation
                    if (item.Instructions) {
                        try {
                            const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(item.Instructions) + '&langpair=en|ar');
                            const tData = await res.json();
                            if (tData?.responseData?.translatedText) arabicInst = tData.responseData.translatedText;
                        } catch (e) {}
                    }

                    // Compact HTML Card
                    htmlContent += `
                        <div class="label-card">
                            <div class="header">${item.FacilityName || 'Pharmacy'}</div>
                            <div class="row"><span class="lbl">Pt:</span><span class="val">${item.PatientName || ''}</span></div>
                            <div class="row"><span class="lbl">Dr:</span><span class="val">${item.DoctorName || ''}</span></div>
                            <div class="row"><span class="lbl">Ph:</span><span class="val">${item.PharmacistName || ''}</span></div>
                            
                            <div class="drug-row">${item.DrugName || ''}</div>
                            
                            <div class="grid">
                                <div class="row"><span class="lbl">Rx:</span><span class="val">${item.PrescriptionDate || ''}</span></div>
                                <div class="row"><span class="lbl">Qty:</span><span class="val">${item.Quantity || ''}</span></div>
                                <div class="row"><span class="lbl">Exp:</span><span class="val">${item.ExpiryDate || ''}</span></div>
                                <div class="row"><span class="lbl">Lot:</span><span class="val">${item.Batch || ''}</span></div>
                            </div>
                            
                            <div class="inst-eng">Sig: ${item.Instructions || ''}</div>
                            ${arabicInst ? `<div class="inst-ar">${arabicInst}</div>` : ''}
                        </div>
                    `;
                }

                wrapper.innerHTML = htmlContent;
                if (autoPrint) setTimeout(() => window.print(), 600);

            } catch (err) {
                wrapper.innerHTML = '<p style="color:red;">Error: ' + err.message + '</p>';
            }
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosage Label - 60x40mm</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; }
        body { 
            background-color: #f4f5f7; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #000;
        }
        
        /* UI for Browser Preview */
        .no-print-bar { width: 100%; padding: 10px; background: #eee; text-align: center; margin-bottom: 15px; }
        .btn-print { padding: 8px 16px; background: #0078d4; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        #labels-wrapper { display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }

        /* Exactly 60x40mm Landscape */
        .label-card {
            width: 60mm;
            height: 40mm;
            background-color: #fff;
            border: 1.2px solid #000; /* Restores the outer border */
            border-radius: 4px; /* Restores the rounded corners */
            margin: 0 auto;
            overflow: hidden;
            font-size: 5.5px; /* Scaled down to fit 4cm height */
            line-height: 1.15;
            display: flex;
            flex-direction: column;
        }

        /* Restores the original horizontal sections */
        .section {
            padding: 1.5px 3px;
            border-bottom: 1px solid #000;
        }
        .section:last-child {
            border-bottom: none;
            flex-grow: 1; 
        }

        .field-row { display: flex; margin-bottom: 0.5px; align-items: baseline; }
        
        /* Keeps the colons perfectly aligned */
        .label-top { width: 44px; flex-shrink: 0; }
        .colon { width: 4px; flex-shrink: 0; text-align: center; }
        
        .value { flex-grow: 1; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .value-wrap { flex-grow: 1; font-weight: bold; word-break: break-word; white-space: normal; }

        /* Restores the side-by-side grid for Dates and Qty */
        .grid-2-col {
            display: flex;
            width: 100%;
        }
        .col-half {
            width: 50%;
            display: flex;
            flex-direction: column;
        }

        /* Arabic translation styling */
        .ar-text {
            direction: rtl; 
            text-align: right; 
            font-weight: bold; 
            font-size: 6.5px; 
            margin-top: 1px;
        }

        /* Strict Print Override */
        @media print {
            @page {
                size: 60mm 40mm;
                margin: 0;
            }
            body { background-color: #fff; padding: 0; margin: 0; display: block; }
            .no-print-bar { display: none !important; }
            #labels-wrapper { gap: 0; padding: 0; display: block; }
            .label-card {
                border: 1.2px solid #000 !important;
                border-radius: 4px !important;
                margin: 0 !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                page-break-after: always;
            }
            .label-card:last-child { page-break-after: avoid; }
        }
    </style>
</head>
<body>
    <div class="no-print-bar">
        <button class="btn-print" onclick="window.print()">Print Labels (6x4 cm)</button>
    </div>
    <div id="labels-wrapper"></div>

    <script>
        (async function renderLabels() {
            const params = new URLSearchParams(window.location.search);
            const rawData = params.get('data');
            const autoPrint = params.get('print') === '1';
            const wrapper = document.getElementById('labels-wrapper');

            if (!rawData) return wrapper.innerHTML = '<p>No label data received.</p>';

            try {
                const items = JSON.parse(rawData);
                let htmlContent = '';

                for (const item of items) {
                    let arabicInst = '';
                    
                    // Fetch Arabic Translation dynamically
                    if (item.Instructions) {
                        try {
                            const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(item.Instructions) + '&langpair=en|ar');
                            const tData = await res.json();
                            if (tData?.responseData?.translatedText) arabicInst = tData.responseData.translatedText;
                        } catch (e) {}
                    }

                    // The original layout structure restored
                    htmlContent += `
                        <div class="label-card">
                            <div class="section">
                                <div class="field-row"><span class="label-top">Facility Name</span><span class="colon">:</span><span class="value">${item.FacilityName || ''}</span></div>
                                <div class="field-row"><span class="label-top">Patient Name</span><span class="colon">:</span><span class="value">${item.PatientName || ''}</span></div>
                                <div class="field-row"><span class="label-top">Doctor Name</span><span class="colon">:</span><span class="value">${item.DoctorName || ''}</span></div>
                                <div class="field-row"><span class="label-top">Pharmacist Name</span><span class="colon">:</span><span class="value">${item.PharmacistName || ''}</span></div>
                                <div class="field-row"><span class="label-top">Drug Name</span><span class="colon">:</span><span class="value-wrap">${item.DrugName || ''}</span></div>
                            </div>

                            <div class="section grid-2-col">
                                <div class="col-half">
                                    <div class="field-row"><span style="width:52px;">Prescription Date </span><span class="colon">:</span><span class="value">${item.PrescriptionDate || ''}</span></div>
                                    <div class="field-row"><span style="width:52px;">Expiry </span><span class="colon">:</span><span class="value">${item.ExpiryDate || ''}</span></div>
                                </div>
                                <div class="col-half">
                                    <div class="field-row"><span style="width:25px;">Batch </span><span class="colon">:</span><span class="value">${item.Batch || ''}</span></div>
                                    <div class="field-row"><span style="width:25px;">Quantity </span><span class="colon">:</span><span class="value">${item.Quantity || ''}</span></div>
                                </div>
                            </div>

                            <div class="section">
                                <div class="field-row"><span style="width:48px;">Additional Info </span><span class="colon">:</span><span class="value">${item.AdditionalInfo || ''}</span></div>
                            </div>

                            <div class="section">
                                <div class="field-row" style="align-items: flex-start;">
                                    <span style="width:40px; flex-shrink:0;">Instructions </span><span class="colon">:</span>
                                    <span class="value-wrap">${item.Instructions || ''}</span>
                                </div>
                                ${arabicInst ? `<div class="ar-text">التعليمات : <span style="font-weight:bold;">${arabicInst}</span></div>` : ''}
                            </div>
                        </div>
                    `;
                }

                wrapper.innerHTML = htmlContent;
                if (autoPrint) setTimeout(() => window.print(), 600);

            } catch (err) {
                wrapper.innerHTML = '<p style="color:red;">Error: ' + err.message + '</p>';
            }
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosage Label - 6x4cm Landscape</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; }
        body { 
            background-color: #f4f5f7; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #000;
        }
        
        /* UI for Browser Preview */
        .no-print-bar { width: 100%; padding: 10px; background: #eee; text-align: center; margin-bottom: 15px; }
        .btn-print { padding: 8px 16px; background: #0078d4; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        #labels-wrapper { display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }

        /* 60x40mm Landscape Label Container */
        .label-card {
            width: 60mm;
            height: 40mm;
            background-color: #fff;
            border: 1px solid #000;
            border-radius: 6px;
            margin: 0 auto;
            overflow: hidden;
            font-size: 6px; /* Scaled down heavily to fit 40mm height */
            line-height: 1.15;
            display: flex;
            flex-direction: column;
        }

        /* Shrunk Original Layout */
        .section {
            padding: 1.5px 4px;
            border-bottom: 1px solid #000;
        }
        .section:last-child {
            border-bottom: none;
            flex-grow: 1; 
        }

        .field-row { display: flex; margin-bottom: 1px; align-items: baseline; }
        .field-row:last-child { margin-bottom: 0; }
        
        .label-top { width: 48px; flex-shrink: 0; }
        .colon { width: 6px; flex-shrink: 0; }
        
        /* Restrict long names to 1 line, let drugs/instructions wrap */
        .value { flex-grow: 1; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .value-wrap { flex-grow: 1; font-weight: bold; word-break: break-word; }

        .grid-2-col {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 4px;
        }

        .ar-text {
            direction: rtl; 
            text-align: right; 
            font-weight: bold; 
            font-size: 7px; 
            margin-top: 1px;
        }

        /* Strict Print Override */
        @media print {
            @page {
                size: 60mm 40mm; /* Forces landscape 6x4cm roll size */
                margin: 0;
            }
            body { background-color: #fff; padding: 0; margin: 0; display: block; }
            .no-print-bar { display: none !important; }
            #labels-wrapper { gap: 0; padding: 0; display: block; }
            .label-card {
                border: 1px solid #000; /* Keep the original design border */
                margin: 0;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                page-break-after: always;
            }
            .label-card:last-child { page-break-after: avoid; }
        }
    </style>
</head>
<body>

    <div class="no-print-bar">
        <button class="btn-print" onclick="window.print()">Print Labels (6x4 Landscape)</button>
    </div>

    <div id="labels-wrapper"></div>

    <script>
        (async function renderLabels() {
            const params = new URLSearchParams(window.location.search);
            const rawData = params.get('data');
            const autoPrint = params.get('print') === '1';
            const wrapper = document.getElementById('labels-wrapper');

            if (!rawData) return wrapper.innerHTML = '<p>No label data received.</p>';

            try {
                const items = JSON.parse(rawData);
                let htmlContent = '';

                for (const item of items) {
                    let arabicInst = '';
                    
                    // Fetch Free Arabic Translation
                    if (item.Instructions) {
                        try {
                            const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(item.Instructions) + '&langpair=en|ar');
                            const tData = await res.json();
                            if (tData?.responseData?.translatedText) arabicInst = tData.responseData.translatedText;
                        } catch (e) {}
                    }

                    // Exact Original Layout, Miniaturized
                    htmlContent += `
                        <div class="label-card">
                            <div class="section">
                                <div class="field-row"><span class="label-top">Facility Name</span><span class="colon">:</span><span class="value">${item.FacilityName || ''}</span></div>
                                <div class="field-row"><span class="label-top">Patient Name</span><span class="colon">:</span><span class="value">${item.PatientName || ''}</span></div>
                                <div class="field-row"><span class="label-top">Doctor Name</span><span class="colon">:</span><span class="value">${item.DoctorName || ''}</span></div>
                                <div class="field-row"><span class="label-top">Pharmacist Name</span><span class="colon">:</span><span class="value">${item.PharmacistName || ''}</span></div>
                                <div class="field-row"><span class="label-top">Drug Name</span><span class="colon">:</span><span class="value-wrap">${item.DrugName || ''}</span></div>
                            </div>

                            <div class="section grid-2-col">
                                <div>
                                    <div class="field-row"><span>Prescription Date :&nbsp;</span><span class="value">${item.PrescriptionDate || ''}</span></div>
                                    <div class="field-row"><span>Expiry :&nbsp;</span><span class="value">${item.ExpiryDate || ''}</span></div>
                                </div>
                                <div>
                                    <div class="field-row"><span>Batch :&nbsp;</span><span class="value">${item.Batch || ''}</span></div>
                                    <div class="field-row"><span>Quantity :&nbsp;</span><span class="value">${item.Quantity || ''}</span></div>
                                </div>
                            </div>

                            <div class="section">
                                <div class="field-row"><span>Additional Info :&nbsp;</span><span class="value">${item.AdditionalInfo || ''}</span></div>
                            </div>

                            <div class="section">
                                <div class="field-row" style="display: flex; flex-direction: column;">
                                    <div style="display:flex; width: 100%;">
                                        <span>Instructions :&nbsp;</span><span class="value-wrap">${item.Instructions || ''}</span>
                                    </div>
                                    ${arabicInst ? `
                                    <div class="ar-text">
                                        <span>التعليمات :&nbsp;</span><span style="font-weight:bold;">${arabicInst}</span>
                                    </div>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }

                wrapper.innerHTML = htmlContent;
                if (autoPrint) setTimeout(() => window.print(), 600);

            } catch (err) {
                wrapper.innerHTML = '<p style="color:red;">Error: ' + err.message + '</p>';
            }
        })();
    </script>
</body>
</html>

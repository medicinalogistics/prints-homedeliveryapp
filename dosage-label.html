<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosage Label - 60x40mm Landscape</title>
    <style>
        /* Base Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { 
            background-color: #f4f5f7; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #000;
        }
        
        /* UI for Browser Preview */
        .no-print-bar { width: 100%; padding: 10px; background: #eee; text-align: center; margin-bottom: 15px; }
        .btn-print { padding: 8px 16px; background: #0078d4; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        #labels-wrapper { display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }

        /* Exactly 60x40mm Landscape Container */
        .label-card {
            width: 60mm;
            height: 40mm;
            background-color: #fff;
            border: 1px solid #d3d3d3; /* Subtle border for screen preview */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 2mm 2.5mm; /* Tight padding to maximize space */
            overflow: hidden;
            font-size: 7.5px;
            line-height: 1.25;
        }

        /* Layout Structure matching the uploaded image */
        .header { 
            text-align: center; 
            font-weight: bold; 
            font-size: 9.5px; 
            padding-bottom: 2px; 
            margin-bottom: 2px; 
            border-bottom: 1.5px solid #000; 
            white-space: nowrap; 
            overflow: hidden; 
        }
        .row { display: flex; margin-bottom: 0.5px; }
        .lbl { font-weight: bold; margin-right: 2px; }
        .val { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .drug-row { 
            font-weight: bold; 
            font-size: 8.5px; 
            margin-top: 1px; 
            padding-bottom: 2px; 
            margin-bottom: 2px; 
            border-bottom: 1px dashed #000; 
            text-transform: uppercase; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
        }
        
        .grid { 
            display: flex; 
            flex-direction: column; 
            padding-bottom: 2px; 
            margin-bottom: 2px; 
            border-bottom: 1.5px solid #000; 
        }
        .grid-row { display: flex; justify-content: space-between; margin-bottom: 0.5px; }
        .grid-item { display: flex; width: 48%; }
        
        .inst-eng { font-weight: bold; font-size: 7.5px; white-space: normal; }
        .inst-ar { direction: rtl; text-align: right; font-weight: bold; font-size: 8.5px; margin-top: 2px; }

        /* Strict Print Override */
        @media print {
            @page { 
                size: 60mm 40mm; /* Forces 6x4 landscape orientation */
                margin: 0; 
            }
            body { background-color: #fff; padding: 0; margin: 0; display: block; }
            .no-print-bar { display: none !important; }
            #labels-wrapper { gap: 0; padding: 0; display: block; }
            .label-card {
                border: none;
                box-shadow: none;
                margin: 0;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                page-break-after: always;
            }
            .label-card:last-child { page-break-after: avoid; }
        }
    </style>
</head>
<body>

    <div class="no-print-bar">
        <button class="btn-print" onclick="window.print()">Print Labels (6x4 cm Landscape)</button>
    </div>

    <div id="labels-wrapper"></div>

    <script>
        (async function renderLabels() {
            const params = new URLSearchParams(window.location.search);
            const rawData = params.get('data');
            const autoPrint = params.get('print') === '1';
            const wrapper = document.getElementById('labels-wrapper');

            if (!rawData) return wrapper.innerHTML = '<p style="padding:20px;">No label data received.</p>';

            try {
                const items = JSON.parse(rawData);
                let htmlContent = '';

                for (const item of items) {
                    let arabicInst = '';
                    
                    // Fetch Arabic Translation dynamically
                    if (item.Instructions) {
                        try {
                            const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(item.Instructions) + '&langpair=en|ar');
                            const tData = await res.json();
                            if (tData?.responseData?.translatedText) arabicInst = tData.responseData.translatedText;
                        } catch (e) {}
                    }

                    // HTML Card strictly matching the image layout
                    htmlContent += `
                        <div class="label-card">
                            <div class="header">${item.FacilityName || 'Pharmacy'}</div>
                            
                            <div class="row"><span class="lbl">Pt:</span><span class="val">${item.PatientName || ''}</span></div>
                            <div class="row"><span class="lbl">Dr:</span><span class="val">${item.DoctorName || ''}</span></div>
                            <div class="row"><span class="lbl">Ph:</span><span class="val">${item.PharmacistName || ''}</span></div>
                            
                            <div class="drug-row">${item.DrugName || ''}</div>
                            
                            <div class="grid">
                                <div class="grid-row">
                                    <div class="grid-item"><span class="lbl">Rx:</span><span class="val">${item.PrescriptionDate || ''}</span></div>
                                    <div class="grid-item"><span class="lbl">Qty:</span><span class="val">${item.Quantity || ''}</span></div>
                                </div>
                                <div class="grid-row">
                                    <div class="grid-item"><span class="lbl">Exp:</span><span class="val">${item.ExpiryDate || ''}</span></div>
                                    <div class="grid-item"><span class="lbl">Lot:</span><span class="val">${item.Batch || ''}</span></div>
                                </div>
                            </div>
                            
                            <div class="inst-eng"><span class="lbl">Sig:</span> ${item.Instructions || ''}</div>
                            ${arabicInst ? `<div class="inst-ar">${arabicInst}</div>` : ''}
                        </div>
                    `;
                }

                wrapper.innerHTML = htmlContent;
                if (autoPrint) setTimeout(() => window.print(), 600);

            } catch (err) {
                wrapper.innerHTML = '<p style="color:red; padding:20px;">Error: ' + err.message + '</p>';
            }
        })();
    </script>
</body>
</html>
